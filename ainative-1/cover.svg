<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从聊天机器人到 AI Worker</title>
  <desc id="desc">辛海洋关于 Agentic AI 外部演化、关键案例与系统工程范式的在线幻灯片封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.58" stop-color="#0b1d3e"/>
      <stop offset="1" stop-color="#173c78"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="54%">
      <stop offset="0" stop-color="#54d7d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#54d7d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <image href="cocorobo-logo-white.png" x="110" y="82" width="265" height="62" preserveAspectRatio="xMinYMid meet"/>
  <text x="110" y="270" fill="#54d7d0" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="6">AGENTIC AI · ENGINEERING · SYSTEMS</text>
  <text x="110" y="410" fill="#ffffff" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="92" font-weight="760" letter-spacing="-5">从聊天机器人</text>
  <text x="110" y="522" fill="#ffffff" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="92" font-weight="760" letter-spacing="-5">到 AI Worker</text>
  <line x1="112" y1="606" x2="408" y2="606" stroke="#54d7d0" stroke-width="7"/>
  <text x="110" y="676" fill="#b8c5d9" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30">模型怎样学会查资料、用工具、读结果，并在做错时停下来</text>
  <text x="110" y="795" fill="#ffffff" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">辛海洋 · 可可乐博</text>
  <text x="1490" y="795" fill="#8fa5c4" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="23">2026-08-20 · 30 SLIDES</text>
</svg>
