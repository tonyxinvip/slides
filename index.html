<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CocoRobo Slides</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f8fb; background: #07111f; }
    main { width: min(92vw, 960px); padding: 64px 0; }
    .eyebrow { color: #60f1eb; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-size: clamp(44px, 8vw, 88px); line-height: .95; letter-spacing: -.05em; }
    p { margin: 0; color: #aab5c4; font-size: 18px; }
    a { display: block; margin-top: 48px; padding: 28px; color: inherit; text-decoration: none; border: 1px solid #29445f; background: #0d1d2f; transition: transform .2s ease, border-color .2s ease; }
    a:hover { transform: translateY(-3px); border-color: #60f1eb; }
    strong { display: block; font-size: 28px; }
    span { display: block; margin-top: 8px; color: #aab5c4; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CocoRobo · Online Slides</div>
    <h1>Slides</h1>
    <p>内部观点、产品思考与公开分享。</p>
    <a href="./ainative-2/">
      <strong>世界变了：从证据驱动到 Agentic 组织</strong>
      <span>25 页 · 约 40 分钟</span>
    </a>
  </main>
</body>
</html>
