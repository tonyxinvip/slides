  <g fill="#d96737"><circle cx="265" cy="535" r="10"/><circle cx="485" cy="535" r="10"/><circle cx="705" cy="535" r="10"/><circle cx="925" cy="535" r="10"/><circle cx="1145" cy="535" r="10"/><circle cx="1365" cy="535" r="10"/></g>
