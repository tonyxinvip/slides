    <circle cx="1280" cy="205" r="16" fill="#79e6e8" stroke="none"/>
    <circle cx="1064" cy="317" r="10" fill="#ffd166" stroke="none"/>
    <circle cx="1440" cy="89" r="9" fill="#79e6e8" stroke="none"/>
  </g>
  <rect x="112" y="116" width="82" height="8" rx="4" fill="#ffd166"/>
  <text x="112" y="198" fill="#79e6e8" font-size="30" font-family="Arial, 'PingFang SC', sans-serif" letter-spacing="4">PRIMARY SCIENCE · TEACHER AI</text>
  <text x="112" y="380" fill="#f5fbff" font-size="84" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">AI赋能小学科学教与学</text>
