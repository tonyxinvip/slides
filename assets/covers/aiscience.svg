  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#0b3047"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#52d8dd" stop-opacity=".34"/>
      <stop offset="1" stop-color="#52d8dd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="360" fill="url(#glow)"/>
  <g fill="none" stroke="#79e6e8" opacity=".55">
