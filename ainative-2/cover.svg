<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">世界变了：从 AI-native 组织到教育操作系统</title>
  <desc id="desc">CocoRobo 从 Agent 实践走向 AI-native 教育工作系统的行业经验分享封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101e"/>
      <stop offset="0.62" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#17336c"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="22%" r="56%">
      <stop offset="0" stop-color="#60f1eb" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60f1eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <text x="110" y="128" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="6">COCOROBO</text>
  <text x="110" y="292" fill="#60f1eb" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="6">AI-NATIVE EDUCATION FIELD NOTES</text>
  <text x="110" y="450" fill="#ffffff" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="126" font-weight="820" letter-spacing="-7">世界变了</text>
  <text x="110" y="556" fill="#c0ccdc" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44">从 AI-native 组织到教育操作系统</text>
  <line x1="112" y1="632" x2="405" y2="632" stroke="#60f1eb" stroke-width="7"/>
  <text x="110" y="788" fill="#ffffff" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">辛海洋 · 可可乐博</text>
  <text x="1490" y="788" fill="#8fa5c4" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="23">2026-08-17</text>
</svg>
