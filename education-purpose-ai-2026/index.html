  <script id="deck-data" type="application/json">[{"id":1,"title":"AI时代，教育要成就什么？","section":"教育与人的发展","notes":"建议用时：60秒。\n\nAI能写方案、给反馈、带学生一步步解题。交上来的作品越来越完整，教师反而可能更难回答：学生到底学到了什么？今天就从这个困惑出发。请大家带着最近的一节课来听：哪一项任务完成得不错，却让你对学生的理解拿不准？我们用一个虚构的生态瓶课堂反复讨论，逐次加入新信息，看看自己的判断怎样变化。最后，每人选一个下周能改的教学环节。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":60,"background":"#FFFFFF","elements":[{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":72,"y":56,"w":213,"h":51},{"kind":"text","text":"学习的价值 · 人的成长 · 教师的判断","x":72,"y":155,"w":1100,"h":40,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI时代，\n教育要成就什么？","x":72,"y":237,"w":1136,"h":206,"size":80,"bold":true,"color":"#111820","align":"left","lh":1.18},{"kind":"text","text":"AI进入课堂后，教师如何判断学生是否学到了","x":72,"y":484,"w":1136,"h":50,"size":32,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":612,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"辛海洋 Tony Xin","x":72,"y":637,"w":600,"h":43,"size":27,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"CocoRobo","x":850,"y":637,"w":358,"h":40,"size":25,"bold":false,"color":"#53616C","align":"right","lh":1.35}]},{"id":2,"title":"方案完成了，学生学到了什么？","section":"从一节课开始","notes":"建议用时：110秒。\n\n设想学生研究光照与生态瓶变化的关系。AI给出研究问题、对照安排和记录表，小组照着搭建、观察，最后交出整齐的报告。你会怎样评价？有人会说省下时间了，也有人会担心学生没有自己设计。先把判断记下来。这是一个虚构情境，目前只告诉了大家任务怎么完成，还没有告诉大家教学目标、学生起点和讨论经过。其他学科可以把它换成一篇作文或一道数学题。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":110,"background":"#FFFFFF","elements":[{"kind":"text","text":"假设课堂 · 生态瓶探究","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"方案完成了，学生学到了什么？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"探究：光照条件与生态瓶的变化有什么关系？","x":72,"y":205,"w":1100,"h":108,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"AI提供","x":72,"y":347,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"研究问题、对照安排、观察项目与记录表","x":395,"y":347,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生完成","x":72,"y":466,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"搭建生态瓶、持续观察、整理出完整报告","x":395,"y":466,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"仅凭这些信息，你会怎样评价这次学习？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"02 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":3,"title":"你还需要知道什么？","section":"从一节课开始","notes":"建议用时：160秒。\n\n留30秒独立思考，请两位教师回应。每人说完后追问：如果补看这条信息，你的判断可能怎样改变？有人想听学生解释，有人想看最初的想法，也有人先问这节课教什么。把这些分歧留在现场。经验丰富的教师也会给出不同判断；接下来要讨论的，正是分歧背后的依据。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":160,"background":"#FFFFFF","elements":[{"kind":"text","text":"第一次判断","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"你还需要知道什么？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"你凭什么判断\n学生学到了，或没有学到？","x":72,"y":230,"w":1080,"h":171,"size":55,"bold":true,"color":"#111820","align":"left","lh":1.5},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"写下你的判断，以及最想补看的一条证据。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"03 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":4,"title":"先说清这节课要教什么","section":"从一节课开始","notes":"建议用时：100秒。\n\n先问这节课教什么。如果学生第一次接触实验，完整方案可以让他们认识结构，教师逐步问清为什么需要对照。如果正在练习实验设计，变量和观察项目本来就该留给学生考虑。若学生已有基础，则可以用几份方案比较假设与限制。同一份材料，教学用途不同。备课写了“比较”，也要看课堂里是否真有比较：学生指出了哪处差异，这处差异怎样影响选择？\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":100,"background":"#FFFFFF","elements":[{"kind":"text","text":"从一节课开始","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"先说清这节课要教什么","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"同一份AI方案，放在三种课里，用途不同。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"认识方案结构","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"初学者借助完整示范\n解释每一步为什么需要","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"练习设计实验","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生需要提出假设\n选择变量并说明理由","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"比较更多可能","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"借AI展开多个方案\n讨论约束与适用边界","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"备课时选定的用途，在课堂上发生了吗？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"04 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":5,"title":"AI做完的工作，怎样成为学生的本领？","section":"从一节课开始","notes":"建议用时：80秒。\n\n任务做好和学生学会之间，需要有教学上的连接。AI展示方案后，学生有没有读懂设计理由？遇到不同条件，能不能改？这些连接不会因为用了AI就自然出现。Cukurova关于混合智能的讨论，已经强调任务自动化与人的认知发展的区别。今天把这个问题落到备课：确定要学的本领，安排形成这种本领的活动，再想好怎样检查。能够独立完成、能够借助AI开展更复杂的探究，都可以是目标，但要分别说清。\n\n[Sources]\nCukurova, M. (2025). The interplay of learning, analytics and artificial intelligence in education: A vision for hybrid intelligence. British Journal of Educational Technology, 56(2), 469–488.\nhttps://doi.org/10.1111/bjet.13514\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":80,"background":"#FFFFFF","elements":[{"kind":"text","text":"从一节课开始","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"AI做完的工作，怎样成为学生的本领？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"学生要学会什么？\n哪一步需要亲自想、亲自做？\n学会没有，怎样看出来？","x":72,"y":244,"w":1090,"h":230,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.55},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"判断AI用得好不好，先回答这三个问题。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"Cukurova, 2025 · BJET","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"05 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":6,"title":"有些任务要保留，有些值得重做","section":"AI与学习机会","notes":"建议用时：90秒。\n\n拿一项常布置的作业来想：为什么要学生做？整理资料有时是在学习分类，有时只是抄录。前者需要认真安排学生参与，后者可以考虑交给AI。AI还能提供多个解释，让学生去找分歧、设计检验。保留、调整和新增可以同时发生在一个单元里。教师要说清的是，每项任务究竟帮助学生建立哪一种理解。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"AI与学习机会","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"有些任务要保留，有些值得重做","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"先检查旧任务的教学用处，再决定AI怎样介入。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"保留","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"解释证据、检验结论\n这些理解仍须建立","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"调整","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI先整理资料\n学生集中比较分歧","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"新增","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"借助多个备选解释\n研究原先难以处理的问题","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"这项工作为什么值得学生花时间？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"06 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":7,"title":"好作品只是判断学习的起点","section":"AI与学习机会","notes":"建议用时：90秒。\n\n一份好报告可以证明小组完成了任务。要知道学生学到什么，往前看它怎样产生，往后看学生还能怎样运用。比如报告解释了植物变化，理由是谁提出的？其他成员能不能说明？下周换一种条件，学生会不会改方案？这些问题不需要每节课全部检查。选一个本课最重要的判断，补看过程和一次后续表现，就比单看成品更有依据。\n\n[Sources]\nCukurova, M. (2025). The interplay of learning, analytics and artificial intelligence in education: A vision for hybrid intelligence. British Journal of Educational Technology, 56(2), 469–488.\nhttps://doi.org/10.1111/bjet.13514\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"AI与学习机会","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"好作品只是判断学习的起点","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":203,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"01","x":72,"y":217,"w":78,"h":60,"size":40,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"作品","x":180,"y":217,"w":295,"h":52,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"完成了什么？质量怎样？","x":520,"y":221,"w":688,"h":47,"size":30,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":331,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"02","x":72,"y":345,"w":78,"h":60,"size":40,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"实际活动","x":180,"y":345,"w":295,"h":52,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生解释、比较、决定了什么？","x":520,"y":349,"w":688,"h":47,"size":30,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":459,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"03","x":72,"y":473,"w":78,"h":60,"size":40,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"后续发展","x":180,"y":473,"w":295,"h":52,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"之后能怎样理解、运用和参与？","x":520,"y":477,"w":688,"h":47,"size":30,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"顺着作品追问：怎么做出来的？下次还能怎样做？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"Cukurova, 2025 · BJET","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"07 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":8,"title":"AI的帮助，要让学生接得上","section":"AI与学习机会","notes":"建议用时：90秒。\n\n学生有连续观察记录，却看不出变化，可以让AI帮助整理。之后请学生自己指出差异，说说哪条记录支持哪个解释。如果学生读得懂表格、能据此提出新问题，这种帮助就与探究接上了。如果表格清楚了，学生仍说不出意义，下一步要教的就是怎样读记录。表达支持也一样：它能帮助原先说不出的学生开口，但还要听清他说的理由。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"可能的过程之一 · 支持","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"AI的帮助，要让学生接得上","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"AI整理观察记录后，学生能否读出其中的差异？","x":72,"y":205,"w":1100,"h":108,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"接得上","x":72,"y":347,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"指出变化，提出解释，再用记录检验自己的想法","x":395,"y":347,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"接不上","x":72,"y":466,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"表格更清楚了，却说不出哪条记录支持结论","x":395,"y":466,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"帮助之后，学生多做了哪一步思考？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"08 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":9,"title":"省下的是杂务，还是学习的关键一步？","section":"AI与学习机会","notes":"建议用时：90秒。\n\n省掉排版，可能腾出时间讨论证据；省掉选择变量，则可能省掉了本课正要练的工作。同一操作在不同课里也有不同用处：记录表的设计本身可以是学习目标，也可以只是为另一个探究服务。目标工作不必每次都从零开始，先示范、再让学生处理新条件也可行。要检查的是，学生有没有在整段教学中获得练习机会。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"可能的过程之二 · 绕过","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"省下的是杂务，还是学习的关键一步？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":262,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"绕过非目标操作","x":72,"y":284,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"例如整理版式\n可能腾出时间讨论证据","x":72,"y":375,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":664,"y":262,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"绕过目标活动","x":664,"y":284,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"例如直接决定实验变量\n可能减少练习设计的机会","x":664,"y":375,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"同一步工作，要结合这节课的目标来判断。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"09 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":10,"title":"有了AI，哪些问题现在可以研究了？","section":"AI与学习机会","notes":"建议用时：85秒。\n\nAI提供几个解释，数量本身没有多少教学意义。学生可以先找出解释之间的分歧，再讨论需要什么观察来区分它们。这样，任务就从读懂一个解释，扩展到检验不同解释。生态瓶的变化可能涉及多个条件，哪些已经有记录，哪些还得观察？学生需要参与决定。否则，屏幕上只是多出了几段文字。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":85,"background":"#FFFFFF","elements":[{"kind":"text","text":"可能的过程之三 · 拓展","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"有了AI，哪些问题现在可以研究了？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"让几个解释摆在一起\n找出它们分歧在哪里\n设计观察，判断谁更站得住","x":72,"y":244,"w":1090,"h":230,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.55},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"备选解释多了，学生是否更会提出和检验问题？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"10 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":11,"title":"小组做得好，谁真正参与了？","section":"AI与学习机会","notes":"建议用时：90秒。\n\n小组报告掩盖差异，是合作课堂里熟悉的问题。AI加入后，有人借它终于说清了观察，有人的想法被过早定下的方案盖住，也有人只负责搭建。教师可以在一个关键决定上请不同成员分别解释。不是给学生贴固定标签，而是查清这一环节谁有机会想、谁没有。下一次分工据此调整，也要允许学生用口述、画图或操作来表达。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"AI与学习机会","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"小组做得好，谁真正参与了？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"同一份报告背后，组员经历的学习可能很不同。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"开始说得出","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"借助表达支持\n第一次讲清自己的观察","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"想法被盖住","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI或同伴先定了方案\n自己的疑问没被讨论","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"一直在旁边","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"参与了搭建与记录\n却没有解释或决定的机会","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"下一次讨论，怎样让这些学生也能提出和检验想法？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"11 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":12,"title":"会用AI之后，还要会作教学取舍","section":"AI与学习机会","notes":"建议用时：75秒。\n\nUNESCO框架已包含AI教学法、人的能动性和教师专业学习。Sun等也把GenAI素养与课程设计、教学和评价放在一起，面向的是大学教师，框架来自文献与专家咨询。这些工作帮助界定教师需要什么能力。真正备课时，还要作具体取舍：为什么这里先示范，那里先让学生试？会配置复杂合作的教师，也可能选择直接讲解。专业性体现在选择是否适合眼前的学生，以及能否根据课堂表现调整。\n\n[Sources]\nMiao, F., & Cukurova, M. (2024). AI competency framework for teachers. UNESCO. https://unesdoc.unesco.org/ark:/48223/pf0000391104\nhttps://www.unesco.org/en/articles/ai-competency-framework-teachers\n\nSun, D., Ba, S., Cha, Y., Yu, J., Chiang, F.-K., Dai, H. M., & Lim, C. P. (2026). Empowering university teachers in higher education: A generative AI-responsive competency framework. Computers and Education: Artificial Intelligence, 10, 100542.\nhttps://doi.org/10.1016/j.caeai.2026.100542\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":75,"background":"#FFFFFF","elements":[{"kind":"text","text":"AI与学习机会","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"会用AI之后，还要会作教学取舍","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":262,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"UNESCO框架","x":72,"y":284,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"以人为本与伦理\nAI基础与应用\nAI教学法与专业学习","x":72,"y":375,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":664,"y":262,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"大学教师GenAI框架","x":664,"y":284,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"GenAI素养\n课程与学习设计\n教与学、评价","x":664,"y":375,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"为什么在这节课、对这些学生，选择这种用法？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"Miao & Cukurova, 2024 · UNESCO；Sun et al., 2026 · C&E: AI","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"12 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":13,"title":"学生能决定什么？","section":"人机合作的安排","notes":"建议用时：90秒。\n\n称AI为工具、助教或伙伴，还没有说清谁作决定。学生能点击不同按钮，备选项却可能早已规定好；学生能自由提问，问题也可能总被拉回预设路线。请选一节课，看谁提出问题、判断证据、决定结束。教师当然需要承担很多决定。重点是：与本课目标有关的判断，学生有没有机会练习？当他们提出合理异议时，活动能不能改变？\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"学生能决定什么？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"问题由谁提出？\n证据够不够，由谁判断？\n下一步怎么做，由谁决定？","x":72,"y":230,"w":1080,"h":222,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.5},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"学生有不同想法时，能改变课堂的走向吗？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"13 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":14,"title":"“人机合作”要说清谁做哪一步","section":"人机合作的安排","notes":"建议用时：110秒。\n\n沿着表格看一项具体工作。AI生成备选方案后，比较依据谁来提出？学生决定修改时，能不能说出理由？最后谁打字，不能代表此前全部思考。表中只列了一种可讨论的安排。教师也可以直接示范标准，再让学生尝试运用。备课不妨只选最关键的一行，写清分工；课后就回看这一行实际上怎么发生。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":110,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"“人机合作”要说清谁做哪一步","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"以生态瓶探究为例，逐项检查分工。","x":72,"y":193,"w":1136,"h":64,"size":27,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":277,"w":1136,"h":55,"fill":"#F0F4F7"},{"kind":"text","text":"关键工作","x":86,"y":285,"w":218,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"一种可能的安排","x":332,"y":285,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"继续追问","x":777,"y":285,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"提出问题","x":86,"y":344,"w":218,"h":44,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生提初问，师生共同聚焦","x":332,"y":344,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生的问题进入任务了吗？","x":777,"y":344,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":386,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"生成方案","x":86,"y":398,"w":218,"h":44,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"AI提供备选，学生比较","x":332,"y":398,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"比较依据由谁形成？","x":777,"y":398,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":440,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"解释证据","x":86,"y":452,"w":218,"h":44,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生与同伴先讨论，AI补充","x":332,"y":452,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"解释影响了实际决定吗？","x":777,"y":452,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":494,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"决定修改","x":86,"y":506,"w":218,"h":44,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"小组提出修改，教师追问","x":332,"y":506,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"谁能说明修改的理由？","x":777,"y":506,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":548,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"判断完成","x":86,"y":560,"w":218,"h":44,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"师生参照标准共同回看","x":332,"y":560,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"标准是否被学生理解？","x":777,"y":560,"w":417,"h":44,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":602,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"14 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":15,"title":"提示词写好了，课堂还没安排好","section":"人机合作的安排","notes":"建议用时：95秒。\n\n提示词要求AI先追问，界面却允许一键生成报告；任务单要求同伴讨论，课堂却没留讨论时间。这些情况都可能让设计落空。模型影响回答能力，提示规定回应要求，流程安排先后，界面影响哪些操作容易做，教师和同伴又会临场改变互动。改一条提示后，要看学生有没有因此多做一步解释、比较或选择。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":95,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"提示词写好了，课堂还没安排好","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"学生经历怎样的学习，还取决于流程、界面和课堂互动。","x":72,"y":193,"w":1136,"h":44,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":270,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"模型与提示","x":72,"y":286,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI能够做什么、被要求怎样回应","x":426,"y":286,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":391,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"角色与流程","x":72,"y":407,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"何时调用、依次经过哪些活动、谁负责回应","x":426,"y":407,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":512,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"界面与课堂","x":72,"y":528,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"看见什么、必须提交什么、教师和同伴怎样介入","x":426,"y":528,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"学生实际上做了什么，要到课堂里看。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"15 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":16,"title":"给出答案之后，还可以怎样教？","section":"人机合作的安排","notes":"建议用时：90秒。\n\n完整示范的用途，要连着下一项任务看。可以让学生比较两份方案的假设，解释为什么要控制某个条件，或者在新条件下重新设计。学生也可能把比较结果一起交给AI，再照着读，所以教师仍要追问具体理由。关键是示范给学生提供了什么材料，后面的任务让他怎样使用这些材料。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"给出答案之后，还可以怎样教？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"完整方案可以用来学设计，关键在后续任务。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"比较","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"两份方案的假设\n和证据要求有什么不同？","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"解释","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"为什么这样控制变量？\n还有哪些解释没有排除？","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"运用","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"条件变了以后\n哪些做法需要重新设计？","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"看过答案后，学生需要解释、比较或重新设计什么？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"16 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":17,"title":"AI问了十轮，学生可能仍在填空","section":"人机合作的安排","notes":"建议用时：95秒。\n\n设想AI问了十轮，每一轮都把答案缩小到几个词。学生回答得很顺，课后却说不清为什么要这样设计实验。这样的情境提醒我们：频繁回应仍可能缺少对整体思路的理解。连续追问当然可以帮助学生，尤其在他不知道从哪里开始时。教师要听的是，学生能否把各步联系起来，能否发现某个问题问得不合适，条件变了会怎样处理。检查这些表现，才知道下一步该继续提示，还是给学生更大的尝试空间。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":95,"background":"#FFFFFF","elements":[{"kind":"text","text":"讨论情境 · 连续追问","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"AI问了十轮，学生可能仍在填空","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"问题、步骤、标准都定好了，学生只需补上几个词。","x":72,"y":205,"w":1100,"h":108,"size":34,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"表面很热闹","x":72,"y":347,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生一直回答，却没有选择方法或提出新问题","x":395,"y":347,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"追问一处","x":72,"y":466,"w":286,"h":94,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"让学生解释整条思路，或换一个条件重新判断","x":395,"y":466,"w":813,"h":100,"size":29,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"对话次数告诉我们说了多少，解释质量才帮助判断理解。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"17 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":18,"title":"支持何时增减，要看学生表现","section":"人机合作的安排","notes":"建议用时：100秒。\n\n初次接触实验设计，可以先看示范并解释关键步骤；已有经验后，再起草方案、接受反馈；换了情境，则尝试自己选择方法和需要的帮助。这只是一个可调整的教学顺序。某位学生遇到困难可能需要回到示范，复杂任务也可能长期需要合作。支持增减要跟着表现走：哪一步已经理解，哪一步仍离不开提示？\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":100,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"支持何时增减，要看学生表现","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"实验设计可以这样安排，也可以根据困难退回一步。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"初次接触","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"借助示范读懂结构\n学生解释关键步骤","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"共同练习","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生起草与比较\nAI和同伴提供反馈","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"新情境运用","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生选择策略与支持\n说明何时需要AI","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"学生还卡在哪里？哪一步已经可以自己承担？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"18 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":19,"title":"先示范还是先尝试？要看教谁、教什么","section":"人机合作的安排","notes":"建议用时：105秒。\n\n请选一条你会采用的路径，并说出适合哪种学生。先示范，可以观察学生能否解释和改动关键步骤；先尝试，可以看反馈之后改了什么、为什么改；比较多个方案，则要看取舍依据有没有进入决定。也可以提出第四种安排。我们在教研里比较的，应该包括学生起点与预期活动，而不仅是工具名称。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":105,"background":"#FFFFFF","elements":[{"kind":"text","text":"人机合作的安排","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"先示范还是先尝试？要看教谁、教什么","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"同一个探究问题，可以有不同的教学顺序。","x":72,"y":193,"w":1136,"h":64,"size":27,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":277,"w":1136,"h":55,"fill":"#F0F4F7"},{"kind":"text","text":"安排","x":86,"y":285,"w":218,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"期待发生的学习","x":332,"y":285,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"要寻找的证据","x":777,"y":285,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI先示范","x":86,"y":344,"w":218,"h":78,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"学生读懂设计逻辑","x":332,"y":344,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"能解释并调整关键步骤","x":777,"y":344,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":420,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"学生先尝试","x":86,"y":432,"w":218,"h":78,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"暴露想法，再修订方案","x":332,"y":432,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"修改有依据，超出措辞变化","x":777,"y":432,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":508,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"多方案比较","x":86,"y":520,"w":218,"h":78,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"比较假设与限制条件","x":332,"y":520,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"取舍依据进入最终决定","x":777,"y":520,"w":417,"h":78,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":596,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"你会为哪一类学生、在哪个阶段选择哪条路径？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"19 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":20,"title":"同样采用AI方案，两组学得一样吗？","section":"人机合作的安排","notes":"建议用时：160秒。\n\n再补两组课堂经过：一组主要复述，另一组发现条件不一致，修改并解释原因。请与邻座交流40秒，新信息怎样改变了判断？第二组已有比较和修订的线索，但小组表现还不能代表每个人都懂。第一组复述到了哪一步，也要结合此前经验看。现在最值得补问谁？下节课安排什么，才能进一步了解他们？\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":160,"background":"#FFFFFF","elements":[{"kind":"text","text":"第二次判断 · 假设课堂补充","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"同样采用AI方案，两组学得一样吗？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"一组照着做，理由也照着说。\n另一组发现两瓶条件不一致，\n修改方案并说明了原因。","x":72,"y":230,"w":1080,"h":254,"size":55,"bold":true,"color":"#111820","align":"left","lh":1.5},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"新信息改变了什么判断？哪些学生的理解还不清楚？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"20 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":21,"title":"教师的选择，要能说出理由","section":"教师的专业判断","notes":"建议用时：90秒。\n\n作一次教学选择，至少要知道教什么、教谁、怎样看效果。让AI给完整方案，是想帮助学生认识结构，还是想让他们比较多个设计？学生的困难是没想法、不会表达，还是不理解对照？把这些理由写具体，再预想一个学生表现。例如，希望学生能解释为什么两瓶植物数量要一致。课堂里听到解释后，还可以给一个变化条件，看看理解是否稳固。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"教学判断的依据","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"教师的选择，要能说出理由","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"教什么","x":72,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"希望学生学会什么？\n哪一步与这个目标\n直接相关？","x":72,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"教谁","x":466.6666666666667,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生已经会什么？\n眼下卡在哪里？","x":466.6666666666667,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"怎么看","x":861.3333333333334,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"预计学生会怎样做？\n准备观察哪一个表现？","x":861.3333333333334,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"21 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":22,"title":"学生会说“控制变量”，却不会检查方案","section":"教师的专业判断","notes":"建议用时：90秒。\n\n在这个假设课堂里，两瓶的植物数量不同，学生却说其他条件相同。先别急着重复讲控制变量。可以指着两瓶问不同成员：你看到什么差异？它会不会影响我们对光照的判断？如果学生能解释，只是检查时漏掉了，下一步可以改进检查方法。如果说不清为什么数量重要，就需要补充比较或示范。若始终只有一个组员答得出，则要安排其他成员也来解释。一次短追问，能帮助教师区分几种需要不同处理的问题。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"讨论情境 · 生态瓶探究","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"学生会说“控制变量”，却不会检查方案","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":206,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"先看见问题","x":72,"y":222,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生说要保持其他条件相同，\n却漏看了两瓶植物数量不同。","x":426,"y":222,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":327,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"再查明原因","x":72,"y":343,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"是没理解数量差异的影响，\n还是只有一名组员检查过？","x":426,"y":343,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":448,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"据此介入","x":72,"y":464,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"请不同成员指出差异、解释后果，\n再决定补讲什么、让谁继续尝试。","x":426,"y":464,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"22 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":23,"title":"句子写完整了，理由可能还没讲清","section":"教师的专业判断","notes":"建议用时：100秒。\n\n“我们认为……因为观察到……”可以帮助学生把想法说完整。但“因为”后面填了文字，不一定讲清了观察与结论的关系。请学生指出具体哪一次观察，再解释它为什么支持判断。换一条记录，原结论还成立吗？允许口述、画图或操作，避免把语言表达的困难误当成推理困难。这样才能知道句式帮助了表达，还是连理解也推进了。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":100,"background":"#FFFFFF","elements":[{"kind":"text","text":"讨论情境 · 教师加入句式支架","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"句子写完整了，理由可能还没讲清","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"“我们认为……，因为观察到……；但还需要排除……”","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"确实帮上了忙","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生借句式说明，哪一次观\n察支持了自己的判断。","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"只完成了填空","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"“因为”后面有文字，却没\n有解释观察与结论的关系。","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"换材料再问","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"给一条不同的观察：\n原来的结论\n还站得住吗？","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"23 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":24,"title":"想判断什么，就补看哪一种材料","section":"教师的专业判断","notes":"建议用时：90秒。\n\n任务单告诉我们原本怎样设计，互动记录告诉我们部分经过，作品版本显示改了什么，后续任务帮助判断能否再用。几种材料不能互相代替。比如日志没有理由，不妨看看纸上是否画过，听听组员怎样解释；作品修改很大，也要问修改依据来自谁。日常教研可以只围绕一个疑问，补两种材料，不必把每节课变成大型数据采集。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"教师的专业判断","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"想判断什么，就补看哪一种材料","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":235,"w":1136,"h":55,"fill":"#F0F4F7"},{"kind":"text","text":"材料","x":86,"y":243,"w":218,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"可以帮助判断","x":332,"y":243,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"还需补充","x":777,"y":243,"w":417,"h":40,"size":27,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"任务单与配置","x":86,"y":302,"w":218,"h":66,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"原本怎样安排学习","x":332,"y":302,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"课堂是否这样发生","x":777,"y":302,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":366,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"互动与AI日志","x":86,"y":378,"w":218,"h":66,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"谁参与了哪些工作","x":332,"y":378,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"记录之外的活动","x":777,"y":378,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":442,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"作品版本","x":86,"y":454,"w":218,"h":66,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"哪些内容发生改变","x":332,"y":454,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"改变的理由与来源","x":777,"y":454,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":518,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"后续任务","x":86,"y":530,"w":218,"h":66,"size":24,"bold":true,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"能否再次运用","x":332,"y":530,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"条件、时间与个体差异","x":777,"y":530,"w":417,"h":66,"size":24,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":594,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"24 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":25,"title":"提示改好了，课堂为什么没变？","section":"教师的专业判断","notes":"建议用时：100秒。\n\n设想我们把提示词改得更细，让AI不断追问“为什么”。回看课堂才发现，学生赶着进入下一步，有人随手答了一句，小组方案照旧。问题就变了：原来只问提示够不够好，现在还要问学生有没有时间回应，同伴有没有听，回答有没有影响决定。下一次可以选一处关键分歧，让两名成员各说依据，再共同决定方案怎么改。回看时追踪这一处就够了。如果讨论变多、方案仍未改变，也要查清是原方案本来就合理，还是讨论没有触及关键。教研经验来自这样逐次查明原因，失败的尝试也要留下。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":100,"background":"#FFFFFF","elements":[{"kind":"text","text":"假设课堂 · 课后回看","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"提示改好了，课堂为什么没变？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":206,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"原先以为","x":72,"y":222,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"让AI多追问几句，学生就会解释方案。","x":426,"y":222,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":327,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"回看才发现","x":72,"y":343,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生没有停下来讨论，回答也没影响小组的决定。","x":426,"y":343,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":448,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"下次这样改","x":72,"y":464,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"留出比较和回应的时间，追踪一条理由是否改变了方案。","x":426,"y":464,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"25 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":26,"title":"教案写得更快，教师想得更深了吗？","section":"教师的专业判断","notes":"建议用时：90秒。\n\n同样问问自己：AI写完教案后，我对学生的困难更清楚了吗？可以让AI提出几种教法，再结合班级里的具体表现解释取舍。也要回看学生原话和原始作品，检查摘要有没有漏掉细节。留下一条最重要的采纳理由：它针对什么困难，上课时怎样检查。过一段时间换班级或单元，再看自己能否运用这条经验。这样才有依据讨论教师理解怎样发展。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"教师的专业判断","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"教案写得更快，教师想得更深了吗？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"用AI备完课，能否更清楚地解释自己的教学选择？","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"值得用AI做","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"比较几种教法\n预想学生可能的解释\n查找任务遗漏的条件","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"需要回去看","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生原来的话\n实际写过的作品\n课堂里具体卡住的地方","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"留下一个理由","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"这条建议为何采纳？\n针对哪个困难？\n上课时怎样检查？","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"26 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":27,"title":"哪一种困难，值得学生自己经历？","section":"教师的专业判断","notes":"建议用时：90秒。\n\n困难是否值得保留，要看它在教什么。比较证据的课，可以减轻排版负担；学习设计记录表的课，就需要让学生考虑记录哪些项目。同样，值得经历的思考也需要适当帮助。学生完全不知道怎样开始，可以先示范一部分，再让他处理一个差异。让学生承担更多步骤并不是统一目标，重要的是承担哪些步骤、从中学到什么。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"教师的专业判断","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"哪一种困难，值得学生自己经历？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"减轻负担","x":72,"y":236,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"目标是比较证据时，可以借AI整理表格格式。","x":395,"y":236,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"保留思考","x":72,"y":352,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"哪些观察支持结论，需要学生解释并接受追问。","x":395,"y":352,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"安排帮助","x":72,"y":468,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"暂时做不到，可以先看示范，再试着处理一处差异。","x":395,"y":468,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"困难要与学习目标有关，也要让学生有条件克服。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"27 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":28,"title":"练习做得更好，测验未必更好","section":"凭什么说学到了","notes":"建议用时：90秒。\n\nBastani等在土耳其一所高中对近千名学生开展数学实验。两种AI设计都提高练习成绩；普通聊天界面组在随后无AI测验中表现更低，带教学保护的设计大幅减轻这一负面影响。教学保护组并未显示随后测验的显著正向收益，因此不能说它已经促进长期发展。其设计同时包含教师提供的答案、常见错误和反馈提示，不能把差异简单归因于苏格拉底提问。这是特定情境与短期结果。对教师的启发，是把支持在场的表现、改变支持条件后的表现，以及支持具体怎样设计一并交代。我们引用这一研究来说明证据区分的必要，不把它推广成所有AI课堂的统一结果。\n\n[Sources]\nBastani, H., Bastani, O., Sungu, A., Ge, H., Kabakcı, Ö., & Mariman, R. (2025). Generative AI without guardrails can harm learning: Evidence from high school mathematics. Proceedings of the National Academy of Sciences, 122(26), e2422633122.\nhttps://doi.org/10.1073/pnas.2422633122\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"研究对话 · 高中数学情境","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"练习做得更好，测验未必更好","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"高中数学实验中，两种AI设计带来了不同后果。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"有AI练习时","x":72,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"两种AI设计\n都提高了练习成绩","x":72,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"撤去AI测验时","x":466.6666666666667,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"普通聊天组低于对照组\n加入教学保护后\n这一负面影响减轻","x":466.6666666666667,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":302,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"能说明什么","x":861.3333333333334,"y":324,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"支持方式会影响结果\n短期测验尚不能回答\n长期学得怎样","x":861.3333333333334,"y":415,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"Bastani et al., 2025 · PNAS","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"28 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":29,"title":"独立理解与借AI合作，都要有证据","section":"凭什么说学到了","notes":"建议用时：90秒。\n\n若目标是个人理解控制变量，就需要看学生自己的解释与新任务表现。若目标是借助AI和同伴完成复杂探究，就要看问题怎样提出、贡献怎样检查、最终决定怎样形成。两种目标都值得追求，也可能相互促进。但一份精彩的合作成果不能直接证明个人掌握；一次无AI测验也不能完整评价合作能力。评价前先说清自己要判断什么。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"凭什么说学到了","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"独立理解与借AI合作，都要有证据","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"评价个人掌握和合作能力，要安排不同的观察。","x":72,"y":197,"w":1136,"h":88,"size":28,"bold":false,"color":"#53616C","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"个人理解","x":72,"y":324,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"换条件、减提示后，\n能解释理由，\n也能修改方案。","x":72,"y":415,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":664,"y":302,"w":544,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"借AI合作","x":664,"y":324,"w":544,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"能提出问题、检查贡献，\n发现不同解释的分歧，\n据此决定下一步。","x":664,"y":415,"w":544,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"29 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":30,"title":"效果变好了，还要查清为什么","section":"凭什么说学到了","notes":"建议用时：90秒。\n\n第二次作品变好，可能与新安排有关，也可能因为学生更熟悉任务，教师多讲了一次，或同伴提供了更多帮助。先把这些变化记下来，结论才站得稳。再看没有进步的学生：他卡在同一处吗？新支持真的到达他了吗？最后加一次小规模后续检查，下周换个条件再问。这些做法能帮助教研查清有效的原因与适用条件。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"凭什么说学到了","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"效果变好了，还要查清为什么","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":206,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"隔一段时间","x":72,"y":222,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"下周再做，或换一个任务，\n还能解释和运用吗？","x":426,"y":222,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":327,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"看看没成功的","x":72,"y":343,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"同样的安排，谁没有学会？\n他卡在哪一步？","x":426,"y":343,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":448,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"查其他变化","x":72,"y":464,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"是否多了教师指导、同伴帮助，\n或者只是更熟悉任务了？","x":426,"y":464,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"30 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":31,"title":"日志没记到，不代表学生没思考","section":"凭什么说学到了","notes":"建议用时：90秒。\n\n平台看得到输入与点击，看不到的还很多。学生可能在纸上画图、讨论，也可能听了教师一句关键追问。反过来，日志里的一段好解释也可能只出自一个成员。请不同学生分别解释一个决定，或用操作展示理解，往往就能补上重要信息。记录缺失和个人掌握，都不能靠小组产出直接推断。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"凭什么说学到了","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"日志没记到，不代表学生没思考","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"看记录之外","x":72,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"纸笔、操作、\n同伴讨论和教师追问\n也可能承载了思考。","x":72,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":466.6666666666667,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"分清个人与小组","x":466.6666666666667,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"报告由谁写、理由谁懂，\n要分别了解；\n安静也不等于没想法。","x":466.6666666666667,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":861.3333333333334,"y":262,"w":346.6666666666667,"h":2,"fill":"#CCD3D8"},{"kind":"text","text":"补一个小检查","x":861.3333333333334,"y":284,"w":346.6666666666667,"h":88,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"请不同成员解释一处，\n画出来或操作给你看，\n再判断理解到哪里。","x":861.3333333333334,"y":375,"w":346.6666666666667,"h":185,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"31 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":32,"title":"第三次判断：下一课先做什么？","section":"凭什么说学到了","notes":"建议用时：120秒。\n\n最后补两条假设材料。一名学生独立发现新实验同时改变了两个条件，但没有说明怎么改；一个小组提出温度也可能影响结果，要求补测，但两名成员理解不清。请与同伴交流一分钟：下一课先做什么？可以追问个人怎样修改，也可以请不同成员解释为什么要补测。已有材料分别支持了识别问题和小组提出疑问，还缺解释、落实和个人理解。选一个你认为最要紧的缺口，说出理由。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":120,"background":"#FFFFFF","elements":[{"kind":"text","text":"假设课堂 · 再补两条材料","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"第三次判断：下一课先做什么？","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"无AI新任务","x":72,"y":236,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"一名学生发现植物实验同时改变了水量与种类，但尚未解释怎样\n修改。","x":395,"y":236,"w":813,"h":132,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"有AI共同探究","x":72,"y":399,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"小组提出温度可能混淆光照影响，要求补测；两名成员的理解仍\n不清楚。","x":395,"y":399,"w":813,"h":132,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"你会先补问谁、追问什么，或改动哪一个教学环节？","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"32 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":33,"title":"四份值得继续读的材料","section":"研究与实践的对话","notes":"建议用时：30秒。\n\n课后可按问题选择阅读：想了解教师AI能力，读UNESCO；想追问自动化与人的发展，读Cukurova；关注大学教师课程与评价设计，读Sun等；想看练习成绩与后续学习的实证区别，读Bastani等。接下来的五问是备课讨论工具，尚未经过量表验证，不用于给教师打分。\n\n[Sources]\nMiao, F., & Cukurova, M. (2024). AI competency framework for teachers. UNESCO. https://unesdoc.unesco.org/ark:/48223/pf0000391104\nhttps://www.unesco.org/en/articles/ai-competency-framework-teachers\n\nCukurova, M. (2025). The interplay of learning, analytics and artificial intelligence in education: A vision for hybrid intelligence. British Journal of Educational Technology, 56(2), 469–488.\nhttps://doi.org/10.1111/bjet.13514\n\nSun, D., Ba, S., Cha, Y., Yu, J., Chiang, F.-K., Dai, H. M., & Lim, C. P. (2026). Empowering university teachers in higher education: A generative AI-responsive competency framework. Computers and Education: Artificial Intelligence, 10, 100542.\nhttps://doi.org/10.1016/j.caeai.2026.100542\n\nBastani, H., Bastani, O., Sungu, A., Ge, H., Kabakcı, Ö., & Mariman, R. (2025). Generative AI without guardrails can harm learning: Evidence from high school mathematics. Proceedings of the National Academy of Sciences, 122(26), e2422633122.\nhttps://doi.org/10.1073/pnas.2422633122\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":30,"background":"#FFFFFF","elements":[{"kind":"text","text":"研究与实践的对话","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"四份值得继续读的材料","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":206,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"UNESCO · 2024","x":72,"y":221,"w":338,"h":68,"size":28,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI competency framework for teachers：教师AI能力、教学法\n与专业学习。","x":441,"y":221,"w":767,"h":80,"size":25,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":302,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"Cukurova · 2025","x":72,"y":317,"w":338,"h":68,"size":28,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"AI、人类认知与发展：思考任务自动化和人的学习之间的关系。","x":441,"y":317,"w":767,"h":80,"size":25,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":398,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"Sun等 · 2026","x":72,"y":413,"w":338,"h":68,"size":28,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"大学教师的GenAI能力：\n素养、课程设计、教学与评价。","x":441,"y":413,"w":767,"h":80,"size":25,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":494,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"Bastani等 · 2025","x":72,"y":509,"w":338,"h":68,"size":28,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"Generative AI without guardrails can harm learning：区分练\n习表现与后续学习。","x":441,"y":509,"w":767,"h":80,"size":25,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"Miao & Cukurova, 2024 · UNESCO；Cukurova, 2025 · BJET；Sun et al., 2026 · C&E: AI；Bastani et al., 2025 · PNAS","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"33 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":34,"title":"下一次备课，写下这五个回答","section":"带回自己的课堂","notes":"建议用时：90秒。\n\n选一个关键环节，每问只写一两句。第一问别只写高阶思维，可以写“解释为什么两瓶需要保持相同条件”。第二问安排学生实际要做的解释或比较。第三问写清AI承担什么。第四问想想谁可能一直没机会说理由。第五问预先约定：若学生会背原则却不会检查方案，我准备怎样改？教研时交换这五个回答，比单纯展示提示词更容易讨论教学。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":90,"background":"#FFFFFF","elements":[{"kind":"text","text":"带回自己的课堂","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"下一次备课，写下这五个回答","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"rect","x":72,"y":206,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"01 学什么","x":72,"y":222,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"学生这次要学会什么？","x":426,"y":222,"w":782,"h":95,
