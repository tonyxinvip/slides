"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":281,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"02 怎么学","x":72,"y":297,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"哪一步需要他们亲自想、亲自做？","x":426,"y":297,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":356,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"03 AI做什么","x":72,"y":372,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"交给AI哪些工作，会怎样改变学习？","x":426,"y":372,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":431,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"04 看谁","x":72,"y":447,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"谁有机会解释和决定？谁还没参与？","x":426,"y":447,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":506,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"05 怎样改","x":72,"y":522,"w":310,"h":95,"size":31,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"看到什么表现，我会调整这次安排？","x":426,"y":522,"w":782,"h":95,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"34 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":35,"title":"选一节课，只改一个环节","section":"带回自己的课堂","notes":"建议用时：180秒。\n\n给自己三分钟，选一节下周真的要上的课。第一分钟定一件要学会的事和必须经历的一步；第二分钟改一处分工或顺序；第三分钟与邻座核对准备观察什么。范围尽量小，比如比较两份实验方案时，先让每人独立标出一个差异，再讨论是否修改。把观察点写进教案，并约同事一起回看。有余量时请一位教师分享改动和判断依据。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":180,"background":"#FFFFFF","elements":[{"kind":"text","text":"带回自己的课堂","x":72,"y":47,"w":900,"h":36,"size":22,"bold":true,"color":"#2366AC","align":"left","lh":1.35,"noWrap":true},{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":1055,"y":42,"w":153,"h":36},{"kind":"text","text":"选一节课，只改一个环节","x":72,"y":110,"w":1136,"h":80,"size":48,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true,"role":"title"},{"kind":"text","text":"先定目标","x":72,"y":236,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"写出学生要学会的一件事，以及需要亲历的一步。","x":395,"y":236,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"再改安排","x":72,"y":352,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"明确AI做什么、学生做什么，调整一处分工或顺序。","x":395,"y":352,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"text","text":"与同伴核对","x":72,"y":468,"w":290,"h":50,"size":32,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"你准备看什么？如果没有发生，下一步怎么办？","x":395,"y":468,"w":813,"h":99,"size":28,"bold":false,"color":"#111820","align":"left","lh":1.35},{"kind":"rect","x":72,"y":608,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"把改动写到下周的教案里，并约同伴一起看效果。","x":72,"y":626,"w":1136,"h":43,"size":25,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"35 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]},{"id":36,"title":"AI时代，教育要成就什么？","section":"带回自己的课堂","notes":"建议用时：205秒。\n\n我们从一份完整的AI方案出发，追问学生学到了什么。随着材料增加，判断也更具体：谁解释过，理由有没有改变方案，换了条件还能不能处理。教育要成就的，落在这些具体本领上。学生能够说明自己的想法，在新问题面前作出判断，也能够借助AI和同伴做成更复杂的事。教师要决定哪些帮助现在需要、哪些工作值得学生亲历，并在课堂里检查自己的判断。请大家回到刚写的那个改动：下一节课，你准备让学生亲自作出哪个有分量的判断？最后留时间交流。请从一处拿不准的课堂细节开始，我们一起讨论还缺什么信息、下一步可以怎样教。\n\n[Sources]\n本讲座整理的教学讨论与反思问题；情境、安排和新增材料为教学讨论所设，并非课堂实证结果。\n品牌资产：tonyxinvip/slides/teacher-agent-creators-10min/assets/cocorobo-full-dark.svg（用户仓库既有资产）。\n[/Sources]","duration":205,"background":"#FFFFFF","elements":[{"kind":"image","src":"assets/cocorobo-logo-navy.png","x":72,"y":47,"w":185,"h":44},{"kind":"text","text":"把问题带回课堂","x":72,"y":142,"w":900,"h":39,"size":24,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"教育要成就什么？","x":72,"y":232,"w":1136,"h":114,"size":76,"bold":true,"color":"#111820","align":"left","lh":1.35,"noWrap":true},{"kind":"text","text":"让学生能解释自己的想法，\n在新问题面前作出判断，与他人一起把事情做成。","x":72,"y":377,"w":1030,"h":108,"size":34,"bold":false,"color":"#53616C","align":"left","lh":1.5},{"kind":"rect","x":72,"y":532,"w":1136,"h":1,"fill":"#CCD3D8"},{"kind":"text","text":"下一节课，你准备让学生亲自作出哪个有分量的判断？","x":72,"y":561,"w":1110,"h":96,"size":28,"bold":true,"color":"#2366AC","align":"left","lh":1.35},{"kind":"text","text":"辛海洋 Tony Xin · CocoRobo","x":72,"y":686,"w":1020,"h":24,"size":17,"bold":false,"color":"#53616C","align":"left","lh":1.35,"noWrap":true,"role":"footer"},{"kind":"text","text":"36 / 36","x":1110,"y":684,"w":98,"h":27,"size":19,"bold":true,"color":"#53616C","align":"right","lh":1.35,"noWrap":true,"role":"footer"}]}]</script>
