<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="辛海洋在香港教育大学博士生论坛分享：一棵树，一个外星人，和一间未来的教室。">
  <meta name="theme-color" content="#182746">
  <title>一棵树，一个外星人，和一间未来的教室 · 辛海洋</title>
  <style>
    :root{color-scheme:dark;--navy:#182746;--blue:#5f93f2;--ink:#f7f9ff;--muted:#a8b4c9;--line:rgba(255,255,255,.18)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101f;font-family:Inter,"PingFang HK","PingFang SC","Microsoft JhengHei",sans-serif}
    body{background:radial-gradient(circle at 50% 35%,#21385f 0,#0c1729 48%,#050b14 100%);color:var(--ink)}
    button{font:inherit}
    #app{position:fixed;inset:0;display:grid;place-items:center;padding:0;touch-action:pan-y}
    #slideFrame{position:relative;width:min(100vw,calc(100vh * 1601 / 900));height:min(100vh,calc(100vw * 900 / 1601));background:#fff;box-shadow:0 30px 100px rgba(0,0,0,.52);overflow:hidden}
    #slide{display:block;width:100%;height:100%;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}
    .chrome{position:fixed;inset:0;pointer-events:none;transition:opacity .25s ease}
    body.idle .chrome{opacity:0}
    .topbar{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#fff;text-shadow:0 2px 12px #000}
    .actions,.nav{display:flex;gap:8px;pointer-events:auto}
    .control{min-width:42px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(7,16,31,.74);backdrop-filter:blur(14px);color:#fff;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.22)}
    .control:hover,.control:focus-visible{border-color:var(--blue);color:#bcd3ff;outline:none}
    .bottombar{position:absolute;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:18px}
    .counter{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(7,16,31,.74);backdrop-filter:blur(14px);font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#fff;text-shadow:0 2px 10px #000}
    .progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);pointer-events:none}
    .progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s ease}
    #overview{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:rgba(5,11,20,.97);padding:max(74px,calc(env(safe-area-inset-top) + 58px)) max(20px,5vw) max(52px,calc(env(safe-area-inset-bottom) + 38px));color:#fff}
    #overview.open{display:block}
    .overview-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 auto 28px;max-width:1320px}
    .overview-head h1{margin:0;font-size:clamp(24px,4vw,42px);line-height:1.1}
    .overview-head p{margin:8px 0 0;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:1320px;margin:auto}
    .thumb{position:relative;padding:0;border:1px solid var(--line);background:#101b2d;cursor:pointer;color:#fff;text-align:left;overflow:hidden;transition:transform .15s,border-color .15s}
    .thumb:hover,.thumb:focus-visible{transform:translateY(-3px);border-color:var(--blue);outline:none}
    .thumb img{display:block;width:100%;aspect-ratio:1601/900;object-fit:cover;background:#fff}
    .thumb span{position:absolute;right:8px;bottom:8px;padding:5px 8px;border-radius:999px;background:rgba(7,16,31,.8);font:800 10px ui-monospace,monospace}
    .thumb.current{border-color:var(--blue);box-shadow:0 0 0 2px rgba(95,147,242,.3)}
    #closeOverview{pointer-events:auto}
    @media(max-width:640px){
      .brand{max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .control{height:36px;min-width:38px;padding:0 12px}
      .topbar{top:max(8px,env(safe-area-inset-top));left:10px;right:10px}
      .bottombar{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom))}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .overview-head{align-items:center}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main id="app" aria-label="在线幻灯片">
    <div id="slideFrame"><img id="slide" src="./assets/slide-1.png" alt="第 1 页，共 45 页"></div>
  </main>
  <div class="chrome" aria-hidden="false">
    <div class="topbar">
      <div class="brand">COCOROBO · EdUHK DOCTORAL FORUM</div>
      <div class="actions">
        <button class="control" id="overviewBtn" type="button" title="总览（O）">总览</button>
        <button class="control" id="fullscreenBtn" type="button" title="全屏（F）">全屏</button>
      </div>
    </div>
    <div class="bottombar">
      <div class="counter"><span id="current">1</span> / 45</div>
      <div class="nav">
        <button class="control" id="prevBtn" type="button" aria-label="上一页">←</button>
        <button class="control" id="nextBtn" type="button" aria-label="下一页">→</button>
      </div>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </div>
  <section id="overview" aria-label="幻灯片总览" aria-hidden="true">
    <div class="overview-head">
      <div><h1>一棵树，一个外星人，和一间未来的教室</h1><p>辛海洋 · 香港教育大学博士生论坛 · 2026-06-24</p></div>
      <button class="control" id="closeOverview" type="button">关闭</button>
    </div>
    <div class="grid" id="thumbGrid"></div>
  </section>
  <script>
    (() => {
      const count = 45;
      const slide = document.getElementById('slide');
      const currentEl = document.getElementById('current');
      const progress = document.getElementById('progress');
      const overview = document.getElementById('overview');
      const grid = document.getElementById('thumbGrid');
      let current = 1;
      let touchX = 0;
      let touchY = 0;
      let idleTimer;

      const clamp = n => Math.max(1, Math.min(count, n));
      const fromHash = () => {
        const n = Number(location.hash.replace('#', ''));
        return Number.isFinite(n) && n >= 1 && n <= count ? n : 1;
      };
      const wake = () => {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
      };
      const render = (n, pushHash = true) => {
        current = clamp(n);
        slide.src = `./assets/slide-${current}.png`;
        slide.alt = `第 ${current} 页，共 ${count} 页`;
        currentEl.textContent = current;
        progress.style.width = `${(current / count) * 100}%`;
        document.querySelectorAll('.thumb').forEach((item, index) => item.classList.toggle('current', index + 1 === current));
        if (pushHash) history.replaceState(null, '', `#${current}`);
        [current - 1, current + 1].filter(n => n >= 1 && n <= count).forEach(n => { const img = new Image(); img.src = `./assets/slide-${n}.png`; });
        wake();
      };
      const showOverview = show => {
        overview.classList.toggle('open', show);
        overview.setAttribute('aria-hidden', String(!show));
        if (show) grid.querySelector('.current')?.scrollIntoView({ block: 'center' });
        wake();
      };
      for (let i = 1; i <= count; i += 1) {
        const button = document.createElement('button');
        button.className = 'thumb';
        button.type = 'button';
        button.innerHTML = `<img src="./assets/slide-${i}.png" loading="lazy" alt="第 ${i} 页缩略图"><span>${String(i).padStart(2, '0')}</span>`;
        button.addEventListener('click', () => { render(i); showOverview(false); });
        grid.appendChild(button);
      }
      document.getElementById('prevBtn').addEventListener('click', () => render(current - 1));
      document.getElementById('nextBtn').addEventListener('click', () => render(current + 1));
      document.getElementById('overviewBtn').addEventListener('click', () => showOverview(true));
      document.getElementById('closeOverview').addEventListener('click', () => showOverview(false));
      document.getElementById('fullscreenBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
      document.getElementById('app').addEventListener('click', event => {
        if (event.clientX < innerWidth * .32) render(current - 1);
        else render(current + 1);
      });
      document.addEventListener('keydown', event => {
        if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); render(current + 1); }
        else if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); render(current - 1); }
        else if (event.key === 'Home') render(1);
        else if (event.key === 'End') render(count);
        else if (event.key.toLowerCase() === 'o') showOverview(!overview.classList.contains('open'));
        else if (event.key.toLowerCase() === 'f') document.getElementById('fullscreenBtn').click();
        else if (event.key === 'Escape') showOverview(false);
      });
      document.addEventListener('mousemove', wake, { passive: true });
      document.addEventListener('touchstart', event => { touchX = event.changedTouches[0].clientX; touchY = event.changedTouches[0].clientY; wake(); }, { passive: true });
      document.addEventListener('touchend', event => {
        const dx = event.changedTouches[0].clientX - touchX;
        const dy = event.changedTouches[0].clientY - touchY;
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) render(current + (dx < 0 ? 1 : -1));
      }, { passive: true });
      window.addEventListener('hashchange', () => render(fromHash(), false));
      render(fromHash(), false);
    })();
  </script>
</body>
</html>
