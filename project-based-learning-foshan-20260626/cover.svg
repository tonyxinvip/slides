  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="#7dd3fc" stroke-opacity=".18"><circle cx="1320" cy="180" r="110"/><circle cx="1320" cy="180" r="190"/><circle cx="1320" cy="180" r="270"/></g>
