<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="辛海洋在深圳教育科学研究院（大鹏培训基地）分享《AI赋能小学科学——人机协同，素养共生》，2026年5月25日。">
  <title>AI赋能小学科学 · ai4science</title>
</head>
<body style="margin:0;background:#071428;color:#eef7fa;font-family:system-ui;display:grid;place-items:center;min-height:100vh">
  <p id="loading">正在载入 ai4science 演讲……</p>
  <script>
  (async()=>{
    try{
      const source='https://raw.githubusercontent.com/tonyxinvip/slides/ee189e0055ade7b68d24da22a3ead14f0a521689/ai4science/index.html';
      const old=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source '+r.status);return r.text()});
      const match=old.match(/const data="([A-Za-z0-9+/=]+)"/);
      if(!match)throw new Error('payload not found');
      const bytes=Uint8Array.from(atob(match[1]),c=>c.charCodeAt(0));
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();
      html=html
        .replaceAll('深圳技术大学','深圳教育科学研究院（大鹏培训基地）')
        .replaceAll('2026-08-21','2026-05-25')
        .replaceAll('2026.8.21','2026.5.25')
        .replaceAll('2026年8月21日','2026年5月25日')
        .replaceAll('8月21日','5月25日');
      document.open();document.write(html);document.close();
    }catch(e){
      document.getElementById('loading').textContent='演讲载入失败，请刷新页面重试。';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
