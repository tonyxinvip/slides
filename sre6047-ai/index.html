<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071923"><meta name="description" content="SRE6047 中小学科学与机器人教育工程和程式设计基础：AI 辅助学习版课程介绍"><title>SRE6047｜AI 辅助学习版课程介绍</title></head><body style="margin:0;background:#02080d;color:#eef7fa;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><p id="loading">正在载入课程介绍……</p><script type="module">try{const files=['payload-0.txt','payload-1.txt','payload-2.txt','payload-3.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(f);return r.text()}));const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='浏览器无法载入演示，请使用最新版 Safari、Chrome 或 Edge。';console.error(e)}</script></body></html>
